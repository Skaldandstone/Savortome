{"version": "0.2", "env": {"shell": "bash"}, "phases": {"pre_build": {"on-failure": "ABORT", "commands": ["set -euo pipefail", "test \"$(aws sts get-caller-identity --query Account --output text)\" = \"$EXPECTED_ACCOUNT\"", "test \"$AWS_DEFAULT_REGION\" = \"us-east-2\"", "[[ \"$SOURCE_SHA256\" =~ ^[a-f0-9]{64}$ ]]", "python3 - <<'VERIFY_SNAPSHOT'\n\"\"\"Embedded in the trusted buildspec, not executed from uploaded source.\"\"\"\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\n\nroot = Path.cwd().resolve()\nmanifest_path = root / \".aws-rebuild/manifest.json\"\nraw = manifest_path.read_bytes()\nif hashlib.sha256(raw).hexdigest() != os.environ[\"SOURCE_SHA256\"]:\n    raise SystemExit(\"Source manifest digest does not match reviewed snapshot\")\nmanifest = json.loads(raw)\nif manifest[\"application\"] != os.environ[\"APP_NAME\"]:\n    raise SystemExit(\"Snapshot belongs to a different application\")\nexpected = set(manifest[\"files\"]) | {\".aws-rebuild/manifest.json\"}\nactual = set()\nfor file in root.rglob(\"*\"):\n    if file.is_symlink():\n        raise SystemExit(\"Source snapshot contains a symlink\")\n    if file.is_file():\n        relative = file.relative_to(root).as_posix()\n        actual.add(relative)\n        if relative != \".aws-rebuild/manifest.json\":\n            wanted = manifest[\"files\"].get(relative)\n            if wanted is None or hashlib.sha256(file.read_bytes()).hexdigest() != wanted:\n                raise SystemExit(\"Source file differs from reviewed snapshot\")\nif actual != expected:\n    raise SystemExit(\"Source snapshot has missing or unexpected files\")\nprint(\"Reviewed source manifest and every packaged file verified\")\n\nVERIFY_SNAPSHOT", "if [ \"$PUBLIC_KEY_REQUIRED\" = true ]; then [[ \"$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY\" = pk_test_* ]]; fi", "if [ \"$BUILD_NAME\" = vaettir-web ]; then [[ \"$NEXT_PUBLIC_API_URL\" = https://* || \"$NEXT_PUBLIC_API_URL\" = http://localhost:* ]]; fi", "docker info >/dev/null 2>&1 || { nohup dockerd >/tmp/dockerd.log 2>&1 & timeout 30 sh -c \"until docker info >/dev/null 2>&1; do sleep 1; done\"; }", "aws ecr get-login-password --region \"$AWS_DEFAULT_REGION\" | docker login --username AWS --password-stdin \"${REPOSITORY_URI%%/*}\""]}, "build": {"on-failure": "ABORT", "commands": ["RELEASE_COMMIT=$(python3 -c \"import json; print(json.load(open('.aws-rebuild/manifest.json'))['commit'])\")", "docker build --platform linux/amd64 --label \"com.skaldandstone.source-sha256=$SOURCE_SHA256\" --build-arg \"NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY\" --build-arg \"NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL\" --build-arg \"VAETTIR_RELEASE_COMMIT=$RELEASE_COMMIT\" --build-arg \"SB_RELEASE_COMMIT=$RELEASE_COMMIT\" --build-arg NEXT_PUBLIC_ENABLE_SW=true -f \"$DOCKERFILE\" -t \"$REPOSITORY_URI:$SOURCE_SHA256\" \"$BUILD_CONTEXT\""]}, "post_build": {"on-failure": "ABORT", "commands": ["test \"$CODEBUILD_BUILD_SUCCEEDING\" = 1", "docker push \"$REPOSITORY_URI:$SOURCE_SHA256\""]}}}
