packages:
  - "apps/*"
  - "packages/*"

# Which dependencies may run install scripts. Everything here is deliberate:
# pnpm treats an undeclared build script as an install failure, which then
# breaks every `pnpm -r` command in the repo.
allowBuilds:
  # tsx ships esbuild and Next ships sharp; both place a platform binary.
  esbuild: true
  sharp: true
  # Clerk uses this for cross-tab session locking.
  browser-tabs-lock: true
  # Optional native speedups for `ws`; harmless if they fail to build.
  bufferutil: true
  utf-8-validate: true
  # Postinstall is only a funding banner.
  core-js: false
  # Its postinstall downloads a release binary whose only job here would be
  # uploading source maps, and that is deliberately disabled: the image build
  # is fail-closed and holds no Sentry auth token. Skipping the download keeps
  # the install hermetic.
  '@sentry/cli': false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.23'
  - '@expo/metro-file-map@57.0.3'
  - '@expo/ui@57.0.17'
  - babel-preset-expo@57.0.11
  - expo-glass-effect@57.0.2
  - expo-modules-core@57.0.17
  - expo-modules-jsi@57.1.0
  - expo-router@57.0.20
  - expo@57.0.21
  - expo-eas-client@57.0.4
  - expo-json-utils@57.0.2
  - expo-manifests@57.0.2
  - expo-structured-headers@57.0.1
  - expo-updates-interface@57.0.2
  - expo-updates@57.0.22

# One React for the whole workspace. Expo SDK 57 pins 19.2.3, and letting the
# web app float to a newer one invites the pair of "why is my hook null"
# problems that come from two copies of React in a tree.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # Security patches for transitive build/runtime dependencies. Next 15.5.25
  # explicitly supports sharp 0.35.4, while PostCSS and js-yaml retain their
  # public major-version APIs.
  sharp: 0.35.4
  postcss: 8.5.18
  js-yaml: 4.3.2
  # expo install wanted 57.0.15 of both, published hours earlier, and wrote a
  # minimumReleaseAge exclusion to get them past the policy. Pinning the
  # previous patch instead keeps the supply-chain guard doing its job; expo
  # pulls expo-constants in transitively, so the pin has to be an override.
  expo-constants: 57.0.14
  expo-notifications: 57.0.14
