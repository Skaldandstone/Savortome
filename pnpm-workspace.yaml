packages:
  - "apps/*"
  - "packages/*"

# Which dependencies may run install scripts. Everything here is deliberate:
# pnpm treats an undeclared build script as an install failure, which then
# breaks every `pnpm -r` command in the repo.
allowBuilds:
  # tsx ships esbuild and Next ships sharp; both place a platform binary.
  esbuild: true
  sharp: true
  # Clerk uses this for cross-tab session locking.
  browser-tabs-lock: true
  # Optional native speedups for `ws`; harmless if they fail to build.
  bufferutil: true
  utf-8-validate: true
  # Postinstall is only a funding banner.
  core-js: false

# One React for the whole workspace. Expo SDK 57 pins 19.2.3, and letting the
# web app float to a newer one invites the pair of "why is my hook null"
# problems that come from two copies of React in a tree.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # expo install wanted 57.0.15 of both, published hours earlier, and wrote a
  # minimumReleaseAge exclusion to get them past the policy. Pinning the
  # previous patch instead keeps the supply-chain guard doing its job; expo
  # pulls expo-constants in transitively, so the pin has to be an override.
  expo-constants: 57.0.14
  expo-notifications: 57.0.14
