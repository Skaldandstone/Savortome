AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  REVIEW ONLY. Fail-closed Second Breakfast private HTTPS ECS runtime delta.
  Creates nothing unless the explicit review gate is changed. Stripe remains absent.

Metadata:
  ReviewStatus: NOT_DEPLOY_APPROVED
  Account: '051722405355'
  Region: us-east-2
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: one private HTTPS ECS service with exact candidate and rollback images
    must:
      - create nothing unless the activation gate is supplied
      - keep billing and beta access disabled by default
      - admit beta users only after owner approval recorded in Clerk metadata
      - accept origin traffic only from the reviewed Cloudflare prefix list
      - use exact Secrets Manager JSON keys and immutable ECR digests
    ref:
      - at: docs/beta/private-runtime-infrastructure.md
        has: session activation, identity, rollback, cleanup, and acceptance procedure
        scope: repository

Parameters:
  ActivationGate:
    Type: String
    Default: NOT_APPROVED
    AllowedValues: [NOT_APPROVED, REVIEWED_EPHEMERAL_PRIVATE_HTTPS]
  ExistingClusterArn:
    Type: String
    Default: arn:aws:ecs:us-east-2:051722405355:cluster/skaldandstone-production
    AllowedPattern: '^arn:aws:ecs:us-east-2:051722405355:cluster/skaldandstone-production$'
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  CloudflareIpv4PrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: Current reviewed Cloudflare IPv4 origin ranges. Prevents direct ALB bypass.
  ApplicationCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-2:051722405355:certificate/d93bcaed-e77a-4a56-b872-a6e6bf2f639e
    AllowedPattern: '^arn:aws:acm:us-east-2:051722405355:certificate/d93bcaed-e77a-4a56-b872-a6e6bf2f639e$'
    Description: Must cover beta.secondbreakfast.skaldandstone.com.
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Dedicated nonpublic Second Breakfast PostgreSQL security group.
  ClerkSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-2:051722405355:secret:dev/secondbreakfast/clerk-[A-Za-z0-9]+$'
    Description: Required runtime Clerk secret in the consolidated account. No default is safe.
  DatabaseSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-2:051722405355:secret:dev/secondbreakfast/database/[0-9]{10}-[A-Za-z0-9]+$'
  BetaClerkUserIds:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '^(|user_[A-Za-z0-9]+(,user_[A-Za-z0-9]+)*)$'
    Description: Optional exact-ID recovery allowlist. Owner-approved Studio metadata is the primary admission path.
  CandidateImage:
    Type: String
    Default: 051722405355.dkr.ecr.us-east-2.amazonaws.com/secondbreakfast-web@sha256:bfb6f728aac3f545db1616e8ea50e232234bdd6337b0198cdb64fcd302cbb5ff
    AllowedPattern: '^051722405355\.dkr\.ecr\.us-east-2\.amazonaws\.com/secondbreakfast-web@sha256:[a-f0-9]{64}$'
  RollbackImage:
    Type: String
    AllowedPattern: '^051722405355\.dkr\.ecr\.us-east-2\.amazonaws\.com/secondbreakfast-web@sha256:[a-f0-9]{64}$'
    Description: Required independently reviewed privacy-v3 rollback digest. No image is currently approved in this account.
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
  BetaEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ExpiresAtEpoch:
    Type: String
    AllowedPattern: '^[0-9]{10}$'
    Description: Mandatory session expiry consumed by the separately reviewed cleanup controller.

Rules:
  ReviewGateKeepsServiceStopped:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Equals: [{Ref: ActivationGate}, REVIEWED_EPHEMERAL_PRIVATE_HTTPS]
            - Fn::Equals: [{Ref: DesiredCount}, '0']
        AssertDescription: DesiredCount must remain zero until the explicit review gate changes.
Conditions:
  CreateReviewedInfrastructure: !Equals [!Ref ActivationGate, REVIEWED_EPHEMERAL_PRIVATE_HTTPS]

Resources:
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateReviewedInfrastructure
    Properties:
      RetentionInDays: 30
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-ExpiresAtEpoch, Value: !Ref ExpiresAtEpoch}

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupDescription: Cloudflare-only HTTPS ingress for Second Breakfast private beta
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-ExpiresAtEpoch, Value: !Ref ExpiresAtEpoch}

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupDescription: Second Breakfast task ingress only from its ALB
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-ExpiresAtEpoch, Value: !Ref ExpiresAtEpoch}

  AlbIngressFromCloudflare:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourcePrefixListId: !Ref CloudflareIpv4PrefixListId

  AlbToTaskEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupId: !GetAtt TaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId

  TaskHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupId: !GetAtt TaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0

  TaskToDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupId: !GetAtt TaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroupId

  DatabaseFromTaskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateReviewedInfrastructure
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId

  ExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateReviewedInfrastructure
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ExactSecondBreakfastRuntimeSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref ClerkSecretArn, !Ref DatabaseSecretArn]

  TaskRole:
    Type: AWS::IAM::Role
    Condition: CreateReviewedInfrastructure
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: CreateReviewedInfrastructure
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-ExpiresAtEpoch, Value: !Ref ExpiresAtEpoch}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateReviewedInfrastructure
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      Matcher: {HttpCode: '200-399'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateReviewedInfrastructure
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref ApplicationCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  CandidateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateReviewedInfrastructure
    Properties:
      Family: secondbreakfast-private-beta-candidate
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Volumes:
        - Name: temporary-files
        - Name: next-cache
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref CandidateImage
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - {ContainerPort: 3000, Protocol: tcp}
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: NEXT_TELEMETRY_DISABLED, Value: '1'}
            - {Name: HOME, Value: /tmp}
            - {Name: TMPDIR, Value: /tmp}
            - {Name: NEXT_PUBLIC_APP_URL, Value: 'https://beta.secondbreakfast.skaldandstone.com'}
            - {Name: SB_BETA_ENABLED, Value: !Ref BetaEnabled}
            - {Name: SB_BETA_CLERK_USER_IDS, Value: !Ref BetaClerkUserIds}
            - {Name: SB_BETA_LOCAL_PREVIEW, Value: 'false'}
            - {Name: STRIPE_CHECKOUT_ENABLED, Value: 'false'}
            - {Name: STRIPE_LIVEMODE, Value: 'false'}
          Secrets:
            - {Name: CLERK_SECRET_KEY, ValueFrom: !Sub '${ClerkSecretArn}:CLERK_SECRET_KEY::'}
            - {Name: DATABASE_URL, ValueFrom: !Sub '${DatabaseSecretArn}:DATABASE_URL::'}
          MountPoints:
            - {SourceVolume: temporary-files, ContainerPath: /tmp, ReadOnly: false}
            - {SourceVolume: next-cache, ContainerPath: /app/apps/web/.next/cache, ReadOnly: false}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: us-east-2
              awslogs-stream-prefix: candidate

  RollbackTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateReviewedInfrastructure
    Properties:
      Family: secondbreakfast-private-beta-rollback
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Volumes:
        - Name: temporary-files
        - Name: next-cache
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref RollbackImage
          Essential: true
          ReadonlyRootFilesystem: true
          PortMappings:
            - {ContainerPort: 3000, Protocol: tcp}
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: NEXT_TELEMETRY_DISABLED, Value: '1'}
            - {Name: HOME, Value: /tmp}
            - {Name: TMPDIR, Value: /tmp}
            - {Name: NEXT_PUBLIC_APP_URL, Value: 'https://beta.secondbreakfast.skaldandstone.com'}
            - {Name: SB_BETA_ENABLED, Value: !Ref BetaEnabled}
            - {Name: SB_BETA_CLERK_USER_IDS, Value: !Ref BetaClerkUserIds}
            - {Name: SB_BETA_LOCAL_PREVIEW, Value: 'false'}
            - {Name: STRIPE_CHECKOUT_ENABLED, Value: 'false'}
            - {Name: STRIPE_LIVEMODE, Value: 'false'}
          Secrets:
            - {Name: CLERK_SECRET_KEY, ValueFrom: !Sub '${ClerkSecretArn}:CLERK_SECRET_KEY::'}
            - {Name: DATABASE_URL, ValueFrom: !Sub '${DatabaseSecretArn}:DATABASE_URL::'}
          MountPoints:
            - {SourceVolume: temporary-files, ContainerPath: /tmp, ReadOnly: false}
            - {SourceVolume: next-cache, ContainerPath: /app/apps/web/.next/cache, ReadOnly: false}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: us-east-2
              awslogs-stream-prefix: rollback

  ProvisionTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateReviewedInfrastructure
    Properties:
      Family: secondbreakfast-private-beta-provision
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Volumes:
        - Name: temporary-files
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: provision
          Image: !Ref CandidateImage
          Essential: true
          ReadonlyRootFilesystem: true
          WorkingDirectory: /app/packages/db
          Command: [node_modules/tsx/dist/cli.mjs, scripts/provision-rds.ts]
          Secrets:
            - {Name: ADMIN_DATABASE_URL, ValueFrom: !Sub '${DatabaseSecretArn}:ADMIN_DATABASE_URL::'}
            - {Name: SB_DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:SB_DB_PASSWORD::'}
          MountPoints:
            - {SourceVolume: temporary-files, ContainerPath: /tmp, ReadOnly: false}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: us-east-2
              awslogs-stream-prefix: provision

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateReviewedInfrastructure
    Properties:
      Family: secondbreakfast-private-beta-migrate
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Volumes:
        - Name: temporary-files
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Ref CandidateImage
          Essential: true
          ReadonlyRootFilesystem: true
          WorkingDirectory: /app/packages/db
          Command: [node_modules/tsx/dist/cli.mjs, src/migrate.ts]
          Secrets:
            - {Name: DATABASE_URL, ValueFrom: !Sub '${DatabaseSecretArn}:DATABASE_URL::'}
          MountPoints:
            - {SourceVolume: temporary-files, ContainerPath: /tmp, ReadOnly: false}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: us-east-2
              awslogs-stream-prefix: migrate

  Service:
    Type: AWS::ECS::Service
    Condition: CreateReviewedInfrastructure
    DependsOn: HttpsListener
    Properties:
      ServiceName: secondbreakfast-web
      Cluster: !Ref ExistingClusterArn
      TaskDefinition: !Ref RollbackTaskDefinition
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: false
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!GetAtt TaskSecurityGroup.GroupId]
          Subnets: !Ref PublicSubnetIds
      PropagateTags: SERVICE
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-ExpiresAtEpoch, Value: !Ref ExpiresAtEpoch}

Outputs:
  ReviewStatus:
    Value: REVIEW_ONLY_NOT_DEPLOY_APPROVED
  AlbDnsName:
    Condition: CreateReviewedInfrastructure
    Value: !GetAtt LoadBalancer.DNSName
  CandidateTaskDefinitionArn:
    Condition: CreateReviewedInfrastructure
    Value: !Ref CandidateTaskDefinition
  RollbackTaskDefinitionArn:
    Condition: CreateReviewedInfrastructure
    Value: !Ref RollbackTaskDefinition
  ProvisionTaskDefinitionArn:
    Condition: CreateReviewedInfrastructure
    Value: !Ref ProvisionTaskDefinition
  MigrationTaskDefinitionArn:
    Condition: CreateReviewedInfrastructure
    Value: !Ref MigrationTaskDefinition
  TaskSecurityGroupId:
    Condition: CreateReviewedInfrastructure
    Value: !GetAtt TaskSecurityGroup.GroupId
