AWSTemplateFormatVersion: '2010-09-09'
Description: Disabled-by-default expiry controller for one bounded Second Breakfast validation session.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: EventBridge invokes one bounded Lambda that deletes the runtime before the database
    must:
      - accept only the exact development account, region, stack names, tags, and two-hour lifetime
      - delete the runtime stack before the database stack
      - disable its schedule only after both managed stacks are absent
    ref:
      - at: docs/beta/private-runtime-infrastructure.md
        has: session creation, expiry, snapshot, and controller cleanup procedure
        scope: repository

Parameters:
  SessionId:
    Type: String
    AllowedPattern: '^sb-[a-f0-9]{32}$'
  CreatedAtEpoch:
    Type: Number
    MinValue: 1
  ExpiresAtEpoch:
    Type: Number
    MinValue: 1
  ControllerEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  ControllerIsEnabled: !Equals [!Ref ControllerEnabled, 'true']

Resources:
  ExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /skaldandstone/development/secondbreakfast-expiry/${SessionId}
      RetentionInDays: 30
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-SessionId, Value: !Ref SessionId}

  ExpiryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exact-secondbreakfast-session-expiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactRuntimeStack
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DeleteStack]
                Resource: arn:aws:cloudformation:us-east-2:051722405355:stack/skaldandstone-development-secondbreakfast-runtime/*
              - Sid: ExactDatabaseStack
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DeleteStack]
                Resource: arn:aws:cloudformation:us-east-2:051722405355:stack/skaldandstone-development-secondbreakfast-database/*
              - Sid: OwnSchedule
                Effect: Allow
                Action: events:DisableRule
                Resource: !Sub arn:${AWS::Partition}:events:us-east-2:051722405355:rule/secondbreakfast-expiry-${SessionId}
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${ExpiryLogGroup.Arn}:*

  ExpiryFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExpiryLogGroup
    Properties:
      Architectures: [arm64]
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ExpiryRole.Arn
      MemorySize: 128
      Timeout: 30
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          SESSION_ID: !Ref SessionId
          CREATED_AT_EPOCH: !Ref CreatedAtEpoch
          EXPIRES_AT_EPOCH: !Ref ExpiresAtEpoch
          EXPECTED_ACCOUNT: '051722405355'
          EXPECTED_REGION: us-east-2
          RULE_NAME: !Sub secondbreakfast-expiry-${SessionId}
      Code:
        ZipFile: |
          __EXPIRY_HANDLER__
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-SessionId, Value: !Ref SessionId}

  ExpiryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub secondbreakfast-expiry-${SessionId}
      Description: Deletes only the exact tagged Second Breakfast stacks after expiry.
      ScheduleExpression: rate(5 minutes)
      State: !If [ControllerIsEnabled, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt ExpiryFunction.Arn
          Id: secondbreakfast-session-expiry
          RetryPolicy: {MaximumEventAgeInSeconds: 300, MaximumRetryAttempts: 2}

  ExpiryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExpiryFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpiryRule.Arn

Outputs:
  ControllerState:
    Value: !If [ControllerIsEnabled, ENABLED, DISABLED]
  MaximumSessionSeconds:
    Value: '7200'
