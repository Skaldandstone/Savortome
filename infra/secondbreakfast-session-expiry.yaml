AWSTemplateFormatVersion: '2010-09-09'
Description: Disabled-by-default expiry controller for one bounded Second Breakfast validation session.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: EventBridge invokes one bounded Lambda that deletes the runtime before the database
    must:
      - accept only the exact development account, region, stack names, tags, and two-hour lifetime
      - delete the runtime stack before the database stack
      - disable its schedule only after both managed stacks are absent
    ref:
      - at: docs/beta/private-runtime-infrastructure.md
        has: session creation, expiry, snapshot, and controller cleanup procedure
        scope: repository

Parameters:
  SessionId:
    Type: String
    AllowedPattern: '^sb-[a-f0-9]{32}$'
  CreatedAtEpoch:
    Type: Number
    MinValue: 1
  ExpiresAtEpoch:
    Type: Number
    MinValue: 1
  ControllerEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  ControllerIsEnabled: !Equals [!Ref ControllerEnabled, 'true']

Resources:
  ExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /skaldandstone/development/secondbreakfast-expiry/${SessionId}
      RetentionInDays: 30
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-SessionId, Value: !Ref SessionId}

  ExpiryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exact-secondbreakfast-session-expiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactRuntimeStack
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DeleteStack]
                Resource: arn:aws:cloudformation:us-east-2:051722405355:stack/skaldandstone-development-secondbreakfast-runtime/*
              - Sid: ExactDatabaseStack
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DeleteStack]
                Resource: arn:aws:cloudformation:us-east-2:051722405355:stack/skaldandstone-development-secondbreakfast-database/*
              - Sid: OwnSchedule
                Effect: Allow
                Action: events:DisableRule
                Resource: !Sub arn:${AWS::Partition}:events:us-east-2:051722405355:rule/secondbreakfast-expiry-${SessionId}
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${ExpiryLogGroup.Arn}:*
              - Sid: PassExactStackDeletionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StackDeletionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  StackDeletionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Lets the expiry controller retry exact tagged runtime and database stack deletion without inheriting operator credentials.
        must:
          - expose deletion and read operations only
          - remain separate from application task and execution roles
          - be passed only to CloudFormation by the exact expiry function
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: delete-exact-secondbreakfast-session-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeleteRuntimeRegionalResources
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:ListTagsForResource
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteTargetGroup
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DeleteSecurityGroup
                  - logs:DescribeLogGroups
                  - logs:ListTagsForResource
                  - logs:DeleteLogGroup
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-2
              - Sid: DeleteDatabaseRegionalResources
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DeleteDBInstance
                  - rds:DescribeDBSubnetGroups
                  - rds:DeleteDBSubnetGroup
                  - rds:DescribeDBParameterGroups
                  - rds:DeleteDBParameterGroup
                  - rds:ListTagsForResource
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:ListSecretVersionIds
                  - secretsmanager:DeleteSecret
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-2
              - Sid: DeleteRuntimeRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:DetachRolePolicy
                  - iam:DeleteRole
                Resource:
                  - arn:aws:iam::051722405355:role/skaldandstone-development-secondbreakfast-*
                  # CloudFormation truncates the runtime stack prefix when it
                  # generates the execution-role physical name.
                  - arn:aws:iam::051722405355:role/skaldandstone-development-secondbreak-*

  ExpiryFunction:
    Type: AWS::Lambda::Function
    Properties:
      Architectures: [arm64]
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ExpiryRole.Arn
      MemorySize: 128
      Timeout: 30
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref ExpiryLogGroup
      Environment:
        Variables:
          SESSION_ID: !Ref SessionId
          CREATED_AT_EPOCH: !Ref CreatedAtEpoch
          EXPIRES_AT_EPOCH: !Ref ExpiresAtEpoch
          EXPECTED_ACCOUNT: '051722405355'
          EXPECTED_REGION: us-east-2
          RULE_NAME: !Sub secondbreakfast-expiry-${SessionId}
          STACK_ROLE_ARN: !GetAtt StackDeletionRole.Arn
      Code:
        ZipFile: |
          """Fail-closed expiry handler for one Second Breakfast validation session."""
          
          from __future__ import annotations
          
          import json
          import os
          import re
          import time
          
          
          SESSION_RE = re.compile(r"^sb-[a-f0-9]{32}$")
          STACK_NAMES = {
              "runtime": "skaldandstone-development-secondbreakfast-runtime",
              "database": "skaldandstone-development-secondbreakfast-database",
          }
          MAX_SESSION_SECONDS = 2 * 60 * 60
          STABLE_STATUSES = {"CREATE_COMPLETE", "UPDATE_COMPLETE"}
          RECOVERABLE_STATUSES = {"DELETE_FAILED"}
          
          
          def _config(environment: dict[str, str]) -> dict[str, object]:
              created = int(environment["CREATED_AT_EPOCH"])
              expires = int(environment["EXPIRES_AT_EPOCH"])
              config = {
                  "session_id": environment["SESSION_ID"],
                  "created": created,
                  "expires": expires,
                  "account": environment["EXPECTED_ACCOUNT"],
                  "region": environment["EXPECTED_REGION"],
                  "rule_name": environment["RULE_NAME"],
                  "stack_role_arn": environment["STACK_ROLE_ARN"],
              }
              if not SESSION_RE.fullmatch(str(config["session_id"])):
                  raise RuntimeError("Session identifier is outside the Second Breakfast boundary")
              if not re.fullmatch(r"\d{12}", str(config["account"])):
                  raise RuntimeError("Expected account is invalid")
              if config["account"] != "051722405355" or config["region"] != "us-east-2":
                  raise RuntimeError("Expected account or region is outside the reviewed boundary")
              role_pattern = rf"^arn:aws:iam::{config['account']}:role/[A-Za-z0-9+=,.@_/-]+$"
              if not re.fullmatch(role_pattern, str(config["stack_role_arn"])):
                  raise RuntimeError("Stack deletion role is outside the reviewed account")
              if expires <= created or expires - created > MAX_SESSION_SECONDS:
                  raise RuntimeError("Expiry must be after creation and within two hours")
              return config
          
          
          def _evaluate_stack(
              stack: dict[str, object], name: str, config: dict[str, object]
          ) -> str:
              if name not in STACK_NAMES.values():
                  raise RuntimeError("Stack name is outside the reviewed boundary")
              stack_id = str(stack["StackId"])
              expected_prefix = (
                  f"arn:aws:cloudformation:{config['region']}:{config['account']}:stack/{name}/"
              )
              if not stack_id.startswith(expected_prefix):
                  raise RuntimeError("Resolved stack ARN is outside the exact account, region, or name")
              tags = {str(item["Key"]): str(item["Value"]) for item in stack.get("Tags", [])}
              expected_tags = {
                  "SkaldAndStone:ManagedBy": "secondbreakfast-session-expiry-v1",
                  "SkaldAndStone:SessionId": str(config["session_id"]),
                  "SkaldAndStone:ExpiresAtEpoch": str(config["expires"]),
              }
              if any(tags.get(key) != value for key, value in expected_tags.items()):
                  raise RuntimeError("Stack expiry tags do not match the controller contract")
              status = str(stack["StackStatus"])
              if status == "DELETE_IN_PROGRESS":
                  return "deleting"
              if status in RECOVERABLE_STATUSES:
                  return "retry-delete"
              if status not in STABLE_STATUSES:
                  raise RuntimeError("Stack is not in a deletion-safe stable state")
              return "ready"
          
          
          def _describe(cloudformation, name: str) -> dict[str, object] | None:
              from botocore.exceptions import ClientError
          
              try:
                  return cloudformation.describe_stacks(StackName=name)["Stacks"][0]
              except ClientError as error:
                  code = error.response.get("Error", {}).get("Code")
                  message = error.response.get("Error", {}).get("Message", "")
                  if code == "ValidationError" and "does not exist" in message:
                      return None
                  raise
          
          
          def handler(_event, _context):
              import boto3
          
              config = _config(dict(os.environ))
              cloudformation = boto3.client("cloudformation", region_name=str(config["region"]))
              events = boto3.client("events", region_name=str(config["region"]))
              stacks = {key: _describe(cloudformation, name) for key, name in STACK_NAMES.items()}
              states = {
                  key: "absent" if value is None else _evaluate_stack(value, STACK_NAMES[key], config)
                  for key, value in stacks.items()
              }
          
              if int(time.time()) < int(config["expires"]):
                  state = "wait"
              elif states["runtime"] in {"ready", "retry-delete"}:
                  cloudformation.delete_stack(
                      StackName=str(stacks["runtime"]["StackId"]),
                      ClientRequestToken=f"expiry-{config['session_id']}-runtime-managed-v1",
                      RoleARN=str(config["stack_role_arn"]),
                  )
                  state = "delete-runtime"
              elif states["runtime"] == "deleting":
                  state = "wait-runtime"
              elif states["database"] in {"ready", "retry-delete"}:
                  cloudformation.delete_stack(
                      StackName=str(stacks["database"]["StackId"]),
                      ClientRequestToken=f"expiry-{config['session_id']}-database-managed-v1",
                      RoleARN=str(config["stack_role_arn"]),
                  )
                  state = "delete-database"
              elif states["database"] == "deleting":
                  state = "wait-database"
              else:
                  events.disable_rule(Name=str(config["rule_name"]))
                  state = "cleanup-verified-stacks-absent"
          
              print(json.dumps({"state": state, "sessionId": config["session_id"], "stacks": states}))
              return {"state": state}
      Tags:
        - {Key: Application, Value: secondbreakfast}
        - {Key: SkaldAndStone-SessionId, Value: !Ref SessionId}

  ExpiryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub secondbreakfast-expiry-${SessionId}
      Description: Deletes only the exact tagged Second Breakfast stacks after expiry.
      ScheduleExpression: rate(5 minutes)
      State: !If [ControllerIsEnabled, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt ExpiryFunction.Arn
          Id: secondbreakfast-session-expiry
          RetryPolicy: {MaximumEventAgeInSeconds: 300, MaximumRetryAttempts: 2}

  ExpiryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExpiryFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpiryRule.Arn

Outputs:
  ControllerState:
    Value: !If [ControllerIsEnabled, ENABLED, DISABLED]
  MaximumSessionSeconds:
    Value: '7200'
  StackDeletionRoleArn:
    Value: !GetAtt StackDeletionRole.Arn
